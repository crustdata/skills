  *{box-sizing:border-box}
  html,body{height:100%}
  .ai-root{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;font-size:14px}
  .ai-root h1,.ai-root h2,.ai-root h3,.ai-root p{margin:0}
  .ai-root a{color:var(--accent);text-decoration:none}
  .ai-root a:hover{text-decoration:underline}

  .shell{display:flex;min-height:100vh}
  .sidenav{width:15rem;flex:none;background:var(--sidebar);border-right:1px solid var(--sb-border);
    display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-head{padding:18px 16px 12px}
  .sb-head a{display:inline-flex}
  .cd-logo{height:17px;width:auto}
  .cd-logo-dark{display:none}
  @media (prefers-color-scheme:dark){.cd-logo-light{display:none}.cd-logo-dark{display:inline-block}}
  :root[data-theme="dark"] .cd-logo-light{display:none!important}
  :root[data-theme="dark"] .cd-logo-dark{display:inline-block!important}
  :root[data-theme="light"] .cd-logo-light{display:inline-block!important}
  :root[data-theme="light"] .cd-logo-dark{display:none!important}
  .sb-group{padding:8px 10px 2px}

<script>

        if(lu){ var li=b.querySelector('.wsl'); li.src=lu;
          li.onerror=function(){ var dot=document.createElement('span'); dot.className='wsd'; dot.style.background=acc2; li.replaceWith(dot); }; }

        nav.appendChild(b);

    mount(order[0]);

function mountDossier(DOSSIER){

  function hashHue(s){var h=0;s=s||'';for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%360;}

  function fmtMoney(v){if(v==null||v==='')return null;if(typeof v==='string')return v;var n=Number(v);if(!isFinite(n))return null;

        var tr=el('div','bar-track');var fl=el('div','bar-fill');fl.style.width=Math.round((+t.weight||0)/maxw*100)+'%';tr.appendChild(fl);
        r.appendChild(tr);r.appendChild(el('div','cnt',Math.round((+t.weight||0)*100)+'%'));b.appendChild(r);
      });
    }

    if((s.buying_signals||[]).length){H('Buying signals');bullets(s.buying_signals);}

    if(s.opener){H('Suggested opener');
      var op=el('div','opener',esc(s.opener));
      var cp=el('div','copy','Copy');cp.onclick=function(ev){ev.stopPropagation();try{navigator.clipboard.writeText(s.opener);cp.textContent='Copied';setTimeout(function(){cp.textContent='Copy';},1400);}catch(e){}};
      op.appendChild(cp);b.appendChild(op);
      attachEvidence(b, s.opener_evidence);
    }
    if((s.talking_points||[]).length){H('Talking points');bullets(s.talking_points,'tp');}
    if((s.likely_objections||[]).length){H('Likely objections');bullets(s.likely_objections,'obj');}

    if((s.notable_posts||[]).length){
      H('Notable posts');var ul=el('ul','posts');
      s.notable_posts.forEach(function(pst){
        var li=el('li');var m=el('div','pmeta');
        if(pst.signal)m.appendChild(el('span','sigtag sig-'+esc(pst.signal),esc((pst.signal||'').replace(/_/g,' '))));
        m.appendChild(el('span','pdate',esc(pst.date||'')));li.appendChild(m);
        var ex=el('div','pex',esc(pst.excerpt||''));
        if(pst.url){var a=el('a','',' →');a.href=pst.url;a.target='_blank';a.rel='noopener';a.style.fontWeight='700';ex.appendChild(a);}
        li.appendChild(ex);ul.appendChild(li);
      });b.appendChild(ul);
    }

    if((s.warm_paths||[]).length){
      H('Warm paths in');
      s.warm_paths.forEach(function(w){
        var d=el('div','warm');
        d.appendChild(el('span','wstr','background:'+({strong:'var(--strong-bg)',medium:'var(--medium-bg)',weak:'var(--weak-bg)'}[w.strength]||'var(--weak-bg)')));
        d.lastChild.textContent=w.strength||'';
        d.lastChild.setAttribute('style','color:'+({strong:'var(--strong)',medium:'var(--medium)',weak:'var(--weak)'}[w.strength]||'var(--weak)')+';background:'+({strong:'var(--strong-bg)',medium:'var(--medium-bg)',weak:'var(--weak-bg)'}[w.strength]||'var(--weak-bg)'));
        var t=el('div');t.appendChild(el('div',null,'<div style="font-weight:700;font-size:13px">'+esc(w.via)+'</div>'));
        if(w.connector)t.appendChild(el('div',null,'<div style="font-size:12.5px;color:var(--ink-3)">'+esc(w.connector)+'</div>'));
        d.appendChild(t);b.appendChild(d);
      });
    }

    if((s.career||[]).length){
      H('Career');var tl=el('ul','timeline');
      s.career.forEach(function(c){var li=el('li');
        li.appendChild(el('div','tc',esc(c.company||'')));
        li.appendChild(el('div','tr',esc(c.title||'')));
        var yr=[c.start,c.end||'present'].filter(Boolean).join(' to ');
        li.appendChild(el('div','ty',esc(yr)));tl.appendChild(li);});b.appendChild(tl);
    }
    if((s.education||[]).length){
      H('Education');var ed=el('ul','ul');
      s.education.forEach(function(e){var t=[e.school,[e.degree,e.field].filter(Boolean).join(', ')].filter(Boolean).join(' — ');ed.appendChild(el('li',null,esc(t)));});
      b.appendChild(ed);
    }
    if((s.data_sources||[]).length||s.posts_analyzed!=null){
      H('Evidence');var sr=el('div','src-row');
      (s.data_sources||[]).forEach(function(x){sr.appendChild(el('span','mini',esc(x)));});
      b.appendChild(sr);
    }
    if((s.gaps||[]).length){var gl=el('ul','gaps');gl.style.marginTop='10px';s.gaps.forEach(function(x){gl.appendChild(el('li',null,licon('triangle-alert',11)+' '+esc(x)));});b.appendChild(gl);}

    drawer.appendChild(b);
    drawer.scrollTop=0;drawer.classList.add('open');scrim.classList.add('open');drawer.setAttribute('aria-hidden','false');
  }

  // ---------- relationship map: weighted referral chains with named intermediaries ----------
  (function(){
    var p=pane('map'); p.classList.add('section');
    var G=DOSSIER.graph||{};
    var conns=(G.connectors||[]).slice(), bridges=(G.bridges||[]), targets=(G.targets||[]);
    if(!conns.length && !targets.length){p.appendChild(el('div','empty','No warm connections loaded for this account.'));return;}
    conns.sort(function(a,b){return (b.strength||0)-(a.strength||0);});
    var shown=conns.slice(0,18);
    var OWNC=G.owner_colors||{};
    function ownerColor(o){return OWNC[o]||'#8a90a2';}
    function mix(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}
    function sColor(s){s=Math.max(0,Math.min(100,s||0));return s<50?mix([140,140,146],[225,145,0],s/50):mix([225,145,0],[0,161,102],(s-50)/50);}
    function sWidth(s){return 1+(Math.max(0,Math.min(100,s||0))/22);}
    function sOp(s){return 0.4+(Math.max(0,Math.min(100,s||0))/180);}
    function tier(s){return s>=75?'strong':s>=45?'medium':'weak';}
    var W=1120, top=46, bot=22;
    var H=Math.max(360, shown.length*48+top+bot);
    var xYou=54, xConn=300, xBr=650, xTgt=W-190;
    var yYou=H/2, yConn={}, yBr={}, yTgt={};
    shown.forEach(function(c,i){yConn[c.id]=top+(i+0.5)*((H-top-bot)/Math.max(shown.length,1));});
    bridges.forEach(function(b,i){yBr[b.id]=top+(i+0.5)*((H-top-bot)/Math.max(bridges.length,1));});
    targets.forEach(function(t,i){yTgt[t.id]=top+(i+0.5)*((H-top-bot)/Math.max(targets.length,1));});
    var byT={};targets.forEach(function(t){byT[t.id]=t;});
    var byB={};bridges.forEach(function(b){byB[b.id]=b;});
    function curve(x1,y1,x2,y2,col,w,op){var mx=(x1+x2)/2;return '<path d="M'+x1+' '+y1+' C '+mx+' '+y1+' '+mx+' '+y2+' '+x2+' '+y2+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" opacity="'+op+'"/>';}
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" style="min-width:640px">';
    svg+='<text x="'+xConn+'" y="20" font-size="10" font-weight="800" letter-spacing="0.05em" fill="var(--ink-3)" text-anchor="middle" font-family="var(--font)">OUR WARM CONNECTIONS</text>';
    svg+='<text x="'+xBr+'" y="20" font-size="10" font-weight="800" letter-spacing="0.05em" fill="var(--ink-3)" text-anchor="middle" font-family="var(--font)">INTERNAL PATH</text>';
    svg+='<text x="'+xTgt+'" y="20" font-size="10" font-weight="800" letter-spacing="0.05em" fill="var(--ink-3)" text-anchor="middle" font-family="var(--font)">DECISION MAKERS</text>';
    shown.forEach(function(c){svg+=curve(xYou+26,yYou,xConn-8,yConn[c.id],ownerColor(c.owner),1.1,0.4);});
    var bt={};
    shown.forEach(function(c){var y=yConn[c.id];var col=sColor(c.strength);
      if(c.bridge&&yBr[c.bridge]!=null){svg+=curve(xConn+8,y,xBr-8,yBr[c.bridge],col,sWidth(c.strength),sOp(c.strength));
        var k=c.bridge+'>'+c.target; if(!(k in bt)||bt[k]<c.strength)bt[k]=c.strength;}
      else if(byT[c.target]){svg+=curve(xConn+8,y,xTgt-9,yTgt[c.target],col,sWidth(c.strength),sOp(c.strength));}});
    Object.keys(bt).forEach(function(k){var pp=k.split('>');if(yBr[pp[0]]==null||yTgt[pp[1]]==null)return;var s=bt[k];svg+=curve(xBr+8,yBr[pp[0]],xTgt-9,yTgt[pp[1]],sColor(s),sWidth(s),sOp(s));});
    svg+='<circle cx="'+xYou+'" cy="'+yYou+'" r="24" fill="var(--accent)"/><text x="'+xYou+'" y="'+(yYou+4)+'" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" font-family="var(--font)">YOU</text>';
    shown.forEach(function(c){var y=yConn[c.id];
      svg+='<circle cx="'+xConn+'" cy="'+y+'" r="6" fill="'+ownerColor(c.owner)+'"/>';
      svg+='<text x="'+(xConn+11)+'" y="'+(y-1)+'" font-size="10.5" font-weight="700" fill="var(--ink)" font-family="var(--font)"><title>'+esc(c.name||'')+'</title>'+esc((c.name||'').length>28?((c.name||'').slice(0,28)+'\u2026'):(c.name||''))+'</text>';
      var ct=(c.title||''); var cts=ct.length>24?(ct.slice(0,24)+'\u2026'):ct;
      svg+='<text x="'+(xConn+11)+'" y="'+(y+10)+'" font-size="8.5" fill="var(--ink-3)" font-family="var(--font)"><title>'+esc(ct)+'</title>'+esc(c.owner||'')+' &#183; '+esc(cts)+' &#183; ~'+(c.hops!=null?c.hops:'?')+'h</text>';});
    bridges.forEach(function(b){var y=yBr[b.id];var nm=b.name||b.label||'';var sub=b.name?((b.title||'').slice(0,32)):'internal org layer';
      svg+='<rect x="'+(xBr-5)+'" y="'+(y-5)+'" width="10" height="10" rx="2" fill="'+(b.name?'var(--tech)':'var(--ink-3)')+'"/>';
      svg+='<text x="'+(xBr+11)+'" y="'+(y-1)+'" font-size="10" font-weight="700" fill="var(--ink-2)" font-family="var(--font)">'+esc(nm.slice(0,28))+'</text>';
      svg+='<text x="'+(xBr+11)+'" y="'+(y+10)+'" font-size="8.5" fill="var(--ink-3)" font-family="var(--font)"><title>'+esc(b.title||b.label||'')+'</title>'+esc(sub)+'</text>';});
    targets.forEach(function(t){var y=yTgt[t.id];var col=roleColor(t.deal_role);
      svg+='<circle cx="'+xTgt+'" cy="'+y+'" r="9" fill="'+col+'"/>';
      svg+='<text x="'+(xTgt+13)+'" y="'+(y-1)+'" font-size="10.5" font-weight="700" fill="var(--ink)" font-family="var(--font)"><title>'+esc(t.name||'')+'</title>'+esc((t.name||'').length>26?((t.name||'').slice(0,26)+'\u2026'):(t.name||''))+'</text>';
      svg+='<text x="'+(xTgt+13)+'" y="'+(y+10)+'" font-size="8.5" fill="'+col+'" font-family="var(--font)">'+esc(t.deal_role||'')+'</text>';});
    svg+='</svg>';
    var gw=el('div','graph-wrap');gw.innerHTML=svg;p.appendChild(gw);
    var lg=el('div','legend');var oh='';
    Object.keys(OWNC).forEach(function(o){oh+='<span><i style="background:'+OWNC[o]+'"></i>'+esc(o)+'</span>';});
    lg.innerHTML=oh+'<span><i style="background:rgb(0,161,102)"></i>Strong / short</span><span><i style="background:rgb(225,145,0)"></i>Medium</span><span><i style="background:rgb(140,140,146)"></i>Weak / many hops</span>';
    p.appendChild(lg);
    if(conns.length>shown.length){p.appendChild(el('div','gaps','Graph shows the '+shown.length+' strongest routes of '+conns.length+'; the full ranked list is below.'));}
    var card=el('div','card');card.style.marginTop='18px';card.appendChild(el('h3',null,'Warm-path chains, strongest first ('+conns.length+')'));
    conns.forEach(function(c){var t=byT[c.target]||{};var b=c.bridge?byB[c.bridge]:null;var col=sColor(c.strength);
      var row=el('div','warm');
      var badge=el('span','wstr',tier(c.strength));badge.setAttribute('style','color:#fff;background:'+col);row.appendChild(badge);
      var mid=el('div');
      var via=b?(b.name?(esc(b.name)+' <span style="color:var(--ink-3)">('+esc(b.title||'')+')</span>'):esc(b.label)):'';
      var chain=esc(c.name)+' <span style="color:var(--ink-3)">(via '+esc(c.owner)+')</span> &#8594; '+(via?via+' &#8594; ':'')+'<b>'+esc(t.name||'')+'</b>';
      mid.appendChild(el('div',null,'<div style="font-weight:650;font-size:13px">'+chain+'</div>'));
      mid.appendChild(el('div',null,'<div style="font-size:12px;color:var(--ink-3)">'+esc(c.title||'')+' &#183; ~'+(c.hops!=null?c.hops:'?')+' hops to '+esc(t.deal_role||'decision maker')+(c.note?(' &#183; '+esc(c.note)):(b&&b.basis?(' &#183; '+esc(b.basis)):''))+'</div>'));
      row.appendChild(mid);
      if(c.url){var a=el('a','ev-btn','ask '+esc(c.owner)+' &#8599;');a.href=c.url;a.target='_blank';a.rel='noopener';a.style.marginLeft='auto';a.style.alignSelf='flex-start';row.appendChild(a);}
      card.appendChild(row);});
    p.appendChild(card);
  })();

  // ---------- signals ----------
  (function(){
    var p=pane('signals'); p.classList.add('section');
    var sigs=(DOSSIER.signals||[]).slice();
    if(!sigs.length){p.appendChild(el('div','empty','No signals captured yet.'));return;}
    var byId={};S.forEach(function(s){byId[s.id]=s;});
    var SEV={high:'var(--high)',medium:'var(--med)',low:'var(--low)'};
    var ICON={job_change:'user',hiring:'trending-up',intent:'zap',buying_intent:'zap',funding:'banknote',headcount:'trending-up',news:'newspaper',post:'file-text'};
    var c=el('div','card');c.appendChild(el('h3',null,'Deal signals · newest first'));
    var ul=el('ul','feed');
    sigs.forEach(function(sg){
      var li=el('li');
      li.appendChild(el('div','when','<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+(SEV[sg.severity]||'var(--low)')+';margin-right:6px"></span>'+esc(sg.date||'')));
      var tx=el('div');
      var kind=el('div','kind',(ICON[sg.type]?licon(ICON[sg.type],12)+' ':'')+esc((sg.type||'').replace(/_/g,' '))+(sg.severity?(' · '+esc(sg.severity)):''));
      tx.appendChild(kind);
      var who=sg.stakeholder_id&&byId[sg.stakeholder_id]?(' <span style="color:var(--ink-3)">— '+esc(byId[sg.stakeholder_id].name)+'</span>'):'';
      tx.appendChild(el('div','txt',esc(sg.text||'')+who));
      attachEvidence(tx, sg.evidence);
      li.appendChild(tx);ul.appendChild(li);
    });
    c.appendChild(ul);p.appendChild(c);
    var ws=DOSSIER.watchers||[];
    if(ws.length){
      var wc=el('div','card');wc.style.marginTop='16px';wc.appendChild(el('h3',null,'Watchers'));
      ws.forEach(function(w){var byId2={};S.forEach(function(s){byId2[s.id]=s;});var nm=(byId2[w.target]||{}).name||w.target||'account';
        wc.appendChild(el('div',null,'<div style="padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px"><span class="mini" style="color:'+(w.status==='active'?'var(--champ)':'var(--ink-3)')+'">'+esc(w.status||'suggested')+'</span> &nbsp;'+esc(w.type)+' → <b>'+esc(nm)+'</b>'+(w.note?(' <span style="color:var(--ink-3)">· '+esc(w.note)+'</span>'):'')+'</div>'));
      });p.appendChild(wc);
    }
  })();

  // ---------- plays ----------
  (function(){
    var p=pane('plays'); p.classList.add('section');
    var plays=(DOSSIER.plays||[]).slice();
    if(!plays.length){p.appendChild(el('div','empty','No plays generated.'));return;}
    var order={high:1,medium:2,low:3};plays.sort(function(a,b){return (order[a.priority]||9)-(order[b.priority]||9);});
    var PC={high:['var(--high)','var(--block-bg)'],medium:['var(--med)','var(--medium-bg)'],low:['var(--low)','var(--user-bg)']};
    var wrap=el('div','plays');
    plays.forEach(function(pl){
      var d=el('div','play');
      var pr=el('div','pri',esc(pl.priority||'')); var cc=PC[pl.priority]||PC.low;
      pr.setAttribute('style','color:'+cc[0]+';background:'+cc[1]);d.appendChild(pr);
      var body=el('div');
      body.appendChild(el('div','pt',esc(pl.title||'')));
      if(pl.why)body.appendChild(el('div','pw','Why: '+esc(pl.why)));
      if(pl.action)body.appendChild(el('div','pa',esc(pl.action)));
      attachEvidence(body, pl.evidence);
      d.appendChild(body);wrap.appendChild(d);
    });
    p.appendChild(wrap);
  })();

  // ---------- theme toggle ----------
  document.getElementById('themeBtn').onclick=function(){
    var r=document.documentElement;var cur=r.getAttribute('data-theme');
    var next=cur==='dark'?'light':cur==='light'?'dark':(matchMedia('(prefers-color-scheme:dark)').matches?'light':'dark');
    r.setAttribute('data-theme',next);
  };
}
})();
</script>
